[package]
name = "op-master"
version = "0.1.0"
edition = "2024"
publish = false
description = "open-proxy 主控：管理面板、订阅、Agent 网关"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
instant-acme = { version = "0.7", default-features = false, features = ["hyper-rustls", "ring"] }
mime_guess = "2"
percent-encoding = "2"
prost = "0.14"
rand = "0.8"
rcgen = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"
x25519-dalek = { version = "2", features = ["static_secrets"] }
yaml-rust2 = "0.13"

[profile.release]
lto = "thin"
strip = true
