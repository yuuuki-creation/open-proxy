# cargo-deny 检查（CI 和测试 VPS 上跑）：docs/code-style.md 规定主控不得依赖 GPL、AGPL、LGPL 的库。

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
# 允许列表里暂时没用到的许可证不报警告
unused-allowed-license = "allow"

# 我们自己的 op-master 不发布（publish = false），不检查它的许可证
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
